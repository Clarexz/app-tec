name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx expo lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Bundle smoke test (Android)
        run: npx expo export -p android --output-dir dist

  servidor:
    name: Servidor en línea (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probar los 3 servicios
        run: |
          fallo=0
          for url in http://2.24.29.189:30001/salud http://2.24.29.189:30002/talleres http://2.24.29.189:30003/salud; do
            echo "== $url"
            curl -sS -i -m 10 "$url" || fallo=1
            echo
          done
          exit $fallo
